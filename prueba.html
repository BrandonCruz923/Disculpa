<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notificaciones Toast</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Varela+Round&display=swap');

    :root {
        --tr: all 0.5s ease 0s;
        --cs1: #005e38;
        --cs2: #03a65a;
        --cs3: #03a65a40;
        --cw1: #c24914;
        --cw2: #fc8621;
        --cw3: #fc862140;
        --ce1: #851d41;
        --ce2: #db3056;
        --ce3: #db305640;
    }

    @property --bg-success {
      syntax: '<percentage>';
      inherits: false;
      initial-value: 145%;
    }

    @property --bg-warning {
      syntax: '<percentage>';
      inherits: false;
      initial-value: -55%;
    }

    @property --bg-error {
      syntax: '<percentage>';
      inherits: false;
      initial-value: 112%;
    }

    @property --bsc {
      syntax: '<color>';
      inherits: false;
      initial-value: red;
    }

    body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex-direction: column;
        background: #131212;
        font-family: "Varela Round", sans-serif;
		
    }
	body.ocultar{
		animation: desaparecer 8s ease forwards;
	}
    .toast-panel {
        display: none; 
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: var(--tr);
        position: absolute;
        padding: 0 1rem;
        height: 100%;
		opacity: 0;
  		animation: aparecer 0.4s ease-out forwards;
    }
	@keyframes aparecer {
  		from {
    		opacity: 0;
    		transform: translateY(10px);
  		}
  		to {
    		opacity: 1;
    		transform: translateY(0);
  		}
	}
	@keyframes desaparecer{
		from {
			opacity: 1;
			transform: translateY(0px);
		}
		to{
			opacity: 0;
			transform: translateY(20px);
		}
	}


    .toast-item {
        overflow: hidden;
        max-height: 25rem;
        transition: var(--tr);
        position: relative;
        animation: show-toast 0.5s ease forwards;
    }

    @keyframes show-toast {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .toast {
        background: linear-gradient(90deg, #1f2333, #22232b);
        color: #f5f5f5;
        padding: 1rem 2rem 1rem 6rem;
        border-radius: 0.25rem;
        position: relative;
        font-weight: 300;
        margin: 1rem 0;
        text-align: left;
        max-width: 15rem;
        transition: var(--tr);
        opacity: 1;
        border: 0.15rem solid #fff2;
        box-shadow: inset 0 0 0.5rem 0 #1d1e26;
    }

    .toast:before {
        content: "";
        position: absolute;
        width: 6.5rem;
        height: 6.15rem;
        bottom: -0.15rem;
        left: -0.15rem;
        z-index: 0;
        border-radius: 0.35rem;
        background: radial-gradient(circle at 0% 50%, var(--clr), #fff0 5rem), radial-gradient(circle at -50% 50%, var(--bg), #fff0 5rem);
        opacity: 0.5;
    }

    .toast:after {
        content: "";
        position: absolute;
        width: 3.5rem;
        height: 3.5rem;
        background: radial-gradient(circle at 50% 50%, var(--clr) 1.25rem, var(--brd) calc(1.25rem + 1px) 100%);
        top: 1.2rem;
        left: 1rem;
        border-radius: 3rem;
        padding-top: 0.2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.75rem;
        box-sizing: border-box;
    }

    .toast h3 {
        font-size: 1.35rem;
        margin: 0;
        line-height: 1.35rem;
        font-weight: 300;
        position: relative;
    }

    .toast p {
        position: relative;
        font-size: 0.95rem;
        z-index: 1;
        margin: 0.25rem 0 0;
    }

    .close {
        position: absolute;
        width: 1.35rem;
        height: 1.35rem;
        text-align: center;
        right: 1rem;
        cursor: pointer;
        border-radius: 100%;
    }

    .close:after {
        position: absolute;
        font-family: 'Varela Round', sans-serif;
        width: 100%;
        height: 100%;
        left: 0;
        font-size: 1.8rem;
        content: "+";
        transform: rotate(45deg);
        border-radius: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .close:hover {
        background: var(--clr);
        color: #22232c;
    }

    .toast.success {
        --bg: var(--cs1);
        --clr: var(--cs2);
        --brd: var(--cs3);
    }

    .toast.success:after,
    .icon-success:after {
        content: "L";
        font-size: 1.5rem;
        font-weight: bold;
        padding-bottom: 0.35rem;
        transform: rotateY(180deg) rotate(-38deg);
        text-indent: 0.1rem;
    }

    .toast.warning {
        --bg: var(--cw1);
        --clr: var(--cw2);
        --brd: var(--cw3);
    }

    .toast.warning:after,
    .icon-warning:after {
        content: "!";
        font-weight: bold;
    }

    .toast.error {
        --bg: var(--ce1);
        --clr: var(--ce2);
        --brd: var(--ce3);
    }

    .toast.error:after,
    .icon-error:after {
        content: "+";
        font-size: 2.85rem;
        line-height: 1.2rem;
        transform: rotate(45deg);
    }

    .toast a {
        color: #fff;
    }

    .toast a:hover {
        color: var(--clr);
    }

    .toast-icons {
        background: linear-gradient(90deg, #1f2333, #22232b);
        padding: 1rem 1rem 1.25rem 1rem;
        display: flex;
        justify-content: space-around;
        border-radius: 0.25rem;
        gap: 1.5rem;
        width: 100%;
        box-sizing: border-box;
        margin-top: 1rem;
        margin-bottom: 1rem;
        position: relative;
        border: 0.15rem solid #fff2;
        box-shadow: inset 0 0 0.5rem 0 #1d1e26;
    }

    .toast-icons:before {
        position: absolute;
        width: calc(100% + 0.3rem);
        height: calc(100% + 0.25rem);
        --bg-success: 45%;
        --bg-warning: 45%;
        --bg-error: 45%;
        --bsc: #fff0;
        background: 
            radial-gradient(circle at 17% var(--bg-success), var(--cs1), #fff0 2rem), 
            radial-gradient(circle at 50% var(--bg-warning), var(--cw1), #fff0 2rem), 
            radial-gradient(circle at 83% var(--bg-error), var(--ce1), #fff0 2rem);
        content: "";
        bottom: -0.15rem;
        border-radius: 0.25rem;
        z-index: 0;
        transition: --bg-success 0.5s ease 0s, --bg-warning 0.5s ease 0s, --bg-error 0.5s ease 0s, --bsc 0.5s ease 0s;
        box-shadow: 0 0 0.35rem 0 var(--bsc) inset;
    }

    .toast-icons:has(label[for=t-success]:hover):before {
        --bg-success: 53%;
        --bsc: var(--cs2);
    }
    .toast-icons:has(label[for=t-warning]:hover):before {
        --bg-warning: 53%;
        --bsc: var(--cw2);
    }
    .toast-icons:has(label[for=t-error]:hover):before {
        --bg-error: 53%;
        --bsc: var(--ce2);
    }

    .toast-icon {
        width: 3.5rem;
        height: 3.5rem;
        border-radius: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        cursor: pointer;
        position: relative;
        background: radial-gradient(circle at 50% 50%, var(--clr) 1.25rem, #fff0 calc(1.25rem + 1px) 100%), radial-gradient(circle at 50% 50%, var(--brd) calc(1.25rem + 1px) 100%);
    }

    .icon-success, .toast-item.success {
        --clr: #03a65a;
        --brd: #03a65a40;
    }

    .icon-warning, .toast-item.warning {
        --clr: #fc8621;
        --brd: #fc862140;
    }

    .icon-error, .toast-item.error {
        --clr: #db3056;
        --brd: #db305640;
    }

    #t-success:checked ~ .toast-panel .toast-item.success,
    #t-warning:checked ~ .toast-panel .toast-item.warning,
    #t-error:checked ~ .toast-panel .toast-item.error {
        max-height: 0;
        opacity: 0;
    }

    input[type=checkbox] {
        display: none;
    }

    .ultimo {
        background: #131212;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: absolute;
        top: 2rem;            
        z-index: 10;
        margin: 0;
    }

    .ultimo h1 {
        color: #00d9ff;
        font-family: sans-serif;
        font-weight: normal;
        font-size: 15px;
        text-align: center;
        letter-spacing: 3px;
        text-shadow: 0 0 10px #00d9ff;
        white-space: nowrap;
        overflow: hidden;
        width: 0;
        border-right: 1px solid #00d9ff;
        animation: typeFinal 2s steps(40, end) forwards;
    }

    @keyframes typeFinal {
        0% { width: 0; }
        1%, 99% { border-right: 1px solid rgb(0, 225, 255); }
        100% { width: 400px; border-right: none; }
    }
  </style>
</head>
<body>
  <input type="checkbox" name="t-success" id="t-success" checked>
  <input type="checkbox" name="t-warning" id="t-warning" checked>
  <input type="checkbox" name="t-error" id="t-error" checked>

  <div id="ultimo" class="ultimo">
      <h1>¿Crees en las segundas oportunidades?</h1>
  </div>

  <div id="menu" class="toast-panel">
      <div class="toast-item success">
          <div id="opcionC" class="toast success">
              <label for="t-success" class="close"></label>
              <h3>Correcto</h3>
              <p>Escogiste la mejor opción, no te vas a arrepentir, Rojita ❤️​.</p>
          </div>
      </div>
      <div class="toast-item warning">
          <div id="opcionW" class="toast warning">
              <label for="t-warning" class="close"></label>
              <h3>Tal vez</h3>
              <p>Disculpa, pero creo que te volviste a equivocar. Verifica la opción.🥺​</p>
          </div>
      </div>
      <div class="toast-item error">
          <div id="opcionE" class="toast error">
              <label for="t-error" class="close"></label>
              <h3>Opción Incorrecta</h3>
              <p>¡Verifica si no te equivocaste de opción!.🥹</p>
          </div>
      </div>
      <div class="toast-icons">
          <label for="t-success" class="toast-icon icon-success"></label>
          <label for="t-warning" class="toast-icon icon-warning"></label>
          <label for="t-error" class="toast-icon icon-error"></label>
      </div>
  </div>
  <script>
      const correcto = document.querySelector('.icon-success')
      const talVez = document.querySelector('.icon-warning')
      const error = document.querySelector('.icon-error')
      const op1 = document.getElementById('t-success')
      const op2 = document.getElementById('t-warning')
      const op3 = document.getElementById('t-error')
      const ultimo = document.getElementById('ultimo')
      const ultimoH10 = ultimo.querySelector('h1:last-of-type')
	  const body = document.getElementById('body')
      
      ultimoH10.addEventListener('animationend', () => {
          setTimeout(() => {
              document.getElementById('menu').style.display = 'flex'
          }, 1000)
      })

      correcto.addEventListener('click', (e) => {
          e.preventDefault()
          op1.checked = false
          op2.checked = true  
          op3.checked = true
		  document.body.classList.add('ocultar')
		 setTimeout(() => {
			window.close()
		 }, 8000);
      });

      talVez.addEventListener('click', (e) => {
          e.preventDefault()
          op1.checked = true
          op2.checked = false 
          op3.checked = true
      });
      error.addEventListener('click', (e) => {
          e.preventDefault()
          op1.checked = true
          op2.checked = true
          op3.checked = false 
      });
  </script>
</body>
</html>
